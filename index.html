<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>成績查詢系統</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", Arial, sans-serif;
      background: linear-gradient(135deg, #eef2f3, #dfe9f3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 28px 26px 32px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 18px;
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      color: #222;
    }

    .desc {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-bottom: 18px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #4f8cff;
      box-shadow: 0 0 0 2px rgba(79, 140, 255, 0.15);
    }

    button {
      padding: 12px 18px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background: #4f8cff;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 4px 10px rgba(79, 140, 255, 0.25);
    }

    button:hover {
      background: #3f7ae0;
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 3px 8px rgba(79, 140, 255, 0.25);
    }

    .result {
      margin-top: 18px;
      font-size: 15px;
      color: #333;
      line-height: 1.9;
      border-top: 1px solid #eee;
      padding-top: 14px;
    }

    .name {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0;
    }

    .label {
      color: #666;
    }

    .value {
      font-weight: 500;
      color: #111;
    }

    .divider {
      border-top: 1px dashed #ddd;
      margin: 10px 0;
    }

    .total {
      margin-top: 6px;
      padding-top: 10px;
      border-top: 2px solid #4f8cff;
      font-size: 16px;
      font-weight: 600;
    }

    .error {
      color: #d9534f;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>成績查詢系統</h1>
    <div class="desc">請輸入身分證後 5 碼</div>

    <div class="input-group">
      <input type="text" id="idInput" placeholder="例如：12345" maxlength="5">
      <button onclick="search()">查詢</button>
    </div>

    <div id="result" class="result"></div>
  </div>

    function search() {
      const id = document.getElementById("idInput").value.trim();
      const resultDiv = document.getElementById("result");

      if (!id) {
        resultDiv.innerHTML = `<div class="error">請輸入身分證後 5 碼</div>`;
        return;
      }

      if (data[id]) {
        const s = data[id];
        resultDiv.innerHTML = `
          <div class="name">${s.name}</div>

          <div class="row"><div class="label">小考 + 龍騰</div><div class="value">${s.quiz}</div></div>
          <div class="row"><div class="label">作業平常表現</div><div class="value">${s.hw}</div></div>
          <div class="row"><div class="label">兩項平均</div><div class="value">${s.avg}</div></div>
          <div class="row"><div class="label">加分</div><div class="value">${s.bonus}</div></div>

          <div class="divider"></div>

          <div class="row"><div class="label">期中考 1</div><div class="value">${s.mid1}</div></div>
          <div class="row"><div class="label">期中考 2</div><div class="value">${s.mid2}</div></div>

        `;
      } else {
        resultDiv.innerHTML = `<div class="error">查無資料，請確認輸入是否正確</div>`;

    }

</html>
